name: m3ta-machine-control-mcp

on:
  push:
    paths:
      - 'm3ta-machine-control-mcp/**'
      - '.github/workflows/m3ta-machine-control-mcp.yml'
  pull_request:
    paths:
      - 'm3ta-machine-control-mcp/**'
      - '.github/workflows/m3ta-machine-control-mcp.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: m3ta-machine-control-mcp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - run: npm test
